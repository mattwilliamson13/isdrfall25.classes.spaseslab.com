project:
  type: website
  render:
    - "*.qmd"
  resources:
    - "files/"
    - "projects/"
    - "resource/"
    - "assignment/"
    - "lesson/"
    - "example/"
    - "slides/*.html"
    - "slides/*.pdf"
    - "slides/img/"
    - "slides/libs/"
    - "slides/css/"
    - "slides/*_files/"

# See https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: auto  # Re-render only when source changes

bibliography: files/bib/references.bib
csl: files/bib/ecology.csl

website:
  title: "Intro to Spatial Data in R"
  site-url: "https://isdrfall25.classes.spaseslab.com"
  description: "Use R to load, visualize, and analyze spatial data"
  
  favicon: "/files/iSDR_logo.png"

  open-graph:
    image: "/files/social-image-f22.png"
    locale: en_US

  navbar:
    pinned: true
    background: "#440065"
    right:
      - syllabus.qmd
      - schedule.qmd
      - text: "Content"
